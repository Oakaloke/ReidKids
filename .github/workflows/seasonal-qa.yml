name: Seasonal frame QA (branch only)
on:
  push:
    branches: [seasonal-calendar-2026]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools in runner temp directory
        run: |
          npm install --prefix "$RUNNER_TEMP/seasonal-tools" --no-package-lock --no-save playwright@1.56.1
          "$RUNNER_TEMP/seasonal-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test calendar, private previews, and viewport layouts
        env:
          BASE_URL: http://127.0.0.1:8126
        run: |
          export NODE_PATH="$RUNNER_TEMP/seasonal-tools/node_modules"
          node --check thanksgiving.js
          node --test qa-seasons/calendar.test.cjs qa-seasons/runtime.test.cjs
          python3 -m http.server 8126 --bind 127.0.0.1 > "$RUNNER_TEMP/seasonal-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent "$BASE_URL/index.html" > /dev/null && break
            sleep 1
          done
          node qa-seasons/browser.cjs
